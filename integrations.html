<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Integrations Section</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }

  .section {
    width: 100%;
    max-width: 960px;
    background: #1a1a1a;
    border-radius: 24px;
    border: 1px solid #2e2e2e;
    padding: 3.5rem 2rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* Ambient top glow */
  .section::before {
    content: '';
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(200,120,30,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 5px 16px;
    border: 1px solid #3a3a3a;
    border-radius: 999px;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.02em;
    margin-bottom: 1.1rem;
  }

  /* Heading */
  .heading {
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    font-weight: 700;
    color: #f0f0f0;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 3.5rem;
    letter-spacing: -0.03em;
  }

  /* Main diagram area */
  .diagram {
    width: 100%;
    max-width: 780px;
    position: relative;
    height: 280px;
  }

  /* Center hub */
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 110px;
    height: 110px;
    background: #232323;
    border-radius: 20px;
    border: 1px solid #3a3a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    box-shadow: 0 0 60px rgba(220, 130, 30, 0.25), 0 0 120px rgba(220, 130, 30, 0.1);
    animation: hubPulse 3s ease-in-out infinite;
  }

  @keyframes hubPulse {
    0%, 100% { box-shadow: 0 0 60px rgba(220,130,30,0.25), 0 0 120px rgba(220,130,30,0.1); }
    50%       { box-shadow: 0 0 80px rgba(220,130,30,0.4),  0 0 160px rgba(220,130,30,0.18); }
  }

  .hub-icon {
    color: #e07820;
    animation: hubSpin 12s linear infinite;
  }

  @keyframes hubSpin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Integration icon cards */
  .icon-card {
    position: absolute;
    width: 52px;
    height: 52px;
    background: #242424;
    border: 1px solid #333;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
    transition: border-color 0.3s, transform 0.3s;
    animation: cardFloat 4s ease-in-out infinite;
  }

  .icon-card:hover {
    border-color: #e07820;
    transform: scale(1.12) !important;
  }

  .icon-card:nth-child(1) { animation-delay: 0s; }
  .icon-card:nth-child(2) { animation-delay: 0.6s; }
  .icon-card:nth-child(3) { animation-delay: 1.2s; }
  .icon-card:nth-child(4) { animation-delay: 1.8s; }
  .icon-card:nth-child(5) { animation-delay: 2.4s; }
  .icon-card:nth-child(6) { animation-delay: 3.0s; }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }

  /* Card positions — left side */
  .card-tl { left: 2%;  top: 10%;  }
  .card-ml { left: 0%;  top: 50%;  transform: translateY(-50%); }
  .card-bl { left: 2%;  bottom: 10%; }

  /* Card positions — right side */
  .card-tr { right: 2%; top: 10%;  }
  .card-mr { right: 0%; top: 50%;  transform: translateY(-50%); }
  .card-br { right: 2%; bottom: 10%; }

  /* SVG canvas for connector paths */
  .connector-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
    z-index: 1;
    pointer-events: none;
  }

  /* Bottom integration list */
  .integrations-list {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-top: 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .int-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .int-item:hover { opacity: 1; }

  .int-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<section class="section">
  <span class="badge">Integration</span>
  <h2 class="heading">Integration with 300+<br>effective tools</h2>

  <div class="diagram" id="diagram">

    <!-- Left cards -->
    <div class="icon-card card-tl" title="Webflow">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M17.8 3H6.2C4.4 3 3 4.4 3 6.2v11.6C3 19.6 4.4 21 6.2 21h11.6c1.8 0 3.2-1.4 3.2-3.2V6.2C21 4.4 19.6 3 17.8 3z" fill="#4353FF" opacity="0.15"/>
        <path d="M15.5 8l-2.3 5.5-1.5-3.3H10l2.3 5.8c-.3.7-.7 1-1.2 1H9.5V19h1.4c1.5 0 2.5-.8 3.2-2.5L18 8h-2.5z" fill="#4353FF"/>
      </svg>
    </div>

    <div class="icon-card card-ml" title="Zapier">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="#FF4A00" opacity="0.15"/>
        <path d="M12 7v4H8M12 7l-2 2M12 17v-4h4M12 17l2-2" stroke="#FF4A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="icon-card card-bl" title="Figma">
      <svg width="22" height="26" viewBox="0 0 38 57" fill="none">
        <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1ABCFE"/>
        <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z" fill="#0ACF83"/>
        <path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z" fill="#FF7262"/>
        <path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z" fill="#F24E1E"/>
        <path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z" fill="#A259FF"/>
      </svg>
    </div>

    <!-- Right cards -->
    <div class="icon-card card-tr" title="Notion">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="5" fill="#fff" opacity="0.1"/>
        <path d="M5 5.5C5 4.67 5.67 4 6.5 4h8l4.5 4.5V19c0 .83-.67 1.5-1.5 1.5h-11C5.67 20.5 5 19.83 5 19V5.5z" fill="#fff" opacity="0.9"/>
        <path d="M14.5 4v4.5H19" stroke="#888" stroke-width="1" fill="none"/>
        <path d="M8 9h8M8 12h8M8 15h5" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="icon-card card-mr" title="Tail">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="#06b6d4" opacity="0.15"/>
        <path d="M8 12c0-2.2 1.1-3.3 3.3-3.3 2.2 0 2.8 1.1 2.2 3.3-.6 2.2 0 3.3 2.2 3.3" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <div class="icon-card card-br" title="Framer">
      <svg width="22" height="26" viewBox="0 0 1000 1500" fill="none">
        <rect width="1000" height="1500" rx="200" fill="#0075ff" opacity="0.15"/>
        <path d="M0 0h1000L500 500H0V0z" fill="#0075ff"/>
        <path d="M0 500h500l500 500H0V500z" fill="#0075ff" opacity="0.7"/>
        <path d="M0 1000h500v500L0 1000z" fill="#0075ff" opacity="0.4"/>
      </svg>
    </div>

    <!-- SVG Connectors drawn by JS -->
    <svg class="connector-svg" id="connectorSvg">
      <defs>
        <linearGradient id="beamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#e07820" stop-opacity="0"/>
          <stop offset="60%" stop-color="#e07820" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#f0a040" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="beamRight" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f0a040" stop-opacity="1"/>
          <stop offset="40%" stop-color="#e07820" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#e07820" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>

    <!-- Center Hub -->
    <div class="hub" id="hub">
      <svg class="hub-icon" width="48" height="48" viewBox="0 0 24 24" fill="none">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="#e07820" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="integrations-list">
    <div class="int-item"><span class="int-dot"></span>Stripe</div>
    <div class="int-item"><span class="int-dot"></span>Slack</div>
    <div class="int-item"><span class="int-dot"></span>GitHub</div>
    <div class="int-item"><span class="int-dot"></span>Notion</div>
    <div class="int-item"><span class="int-dot"></span>Figma</div>
    <div class="int-item"><span class="int-dot"></span>and 295+ more</div>
  </div>
</section>

<script>
  function drawConnectors() {
    const diagram = document.getElementById('diagram');
    const svg = document.getElementById('connectorSvg');
    const hub = document.getElementById('hub');
    const dW = diagram.offsetWidth;
    const dH = diagram.offsetHeight;
    const hCx = dW / 2;
    const hCy = dH / 2;
    const hHalf = 55;

    const cards = {
      tl: document.querySelector('.card-tl'),
      ml: document.querySelector('.card-ml'),
      bl: document.querySelector('.card-bl'),
      tr: document.querySelector('.card-tr'),
      mr: document.querySelector('.card-mr'),
      br: document.querySelector('.card-br'),
    };

    function cardCenter(el) {
      return {
        x: el.offsetLeft + el.offsetWidth / 2,
        y: el.offsetTop + el.offsetHeight / 2
      };
    }

    const tl = cardCenter(cards.tl);
    const ml = cardCenter(cards.ml);
    const bl = cardCenter(cards.bl);
    const tr = cardCenter(cards.tr);
    const mr = cardCenter(cards.mr);
    const br = cardCenter(cards.br);

    svg.innerHTML = `
    <defs>
      <linearGradient id="beamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#e07820" stop-opacity="0"/>
        <stop offset="50%" stop-color="#e07820" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#f0a040" stop-opacity="0.9"/>
      </linearGradient>
      <linearGradient id="beamRight" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f0a040" stop-opacity="0.9"/>
        <stop offset="50%" stop-color="#e07820" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#e07820" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    ${makePath(tl, { x: hCx - hHalf, y: hCy - 18 }, 'beamLeft', 'glow', 0)}
    ${makePath(ml, { x: hCx - hHalf, y: hCy }, 'beamLeft', 'glow', 0.3)}
    ${makePath(bl, { x: hCx - hHalf, y: hCy + 18 }, 'beamLeft', 'glow', 0.6)}
    ${makePath({ x: hCx + hHalf, y: hCy - 18 }, tr, 'beamRight', 'glow', 0.15)}
    ${makePath({ x: hCx + hHalf, y: hCy }, mr, 'beamRight', 'glow', 0.45)}
    ${makePath({ x: hCx + hHalf, y: hCy + 18 }, br, 'beamRight', 'glow', 0.75)}

    ${makeBeam(ml.x + 26, hCy, hCx - hHalf, hCy, 'beamLeft', 0)}
    ${makeBeam(hCx + hHalf, hCy, mr.x - 26, hCy, 'beamRight', 0.3)}
    `;
  }

  function makePath(from, to, grad, filterId, delay) {
    const mx = (from.x + to.x) / 2;
    const d = `M ${from.x} ${from.y} C ${mx} ${from.y}, ${mx} ${to.y}, ${to.x} ${to.y}`;
    const id = `anim-${Math.random().toString(36).substr(2,6)}`;
    return `
      <path d="${d}" fill="none" stroke="#2e2e2e" stroke-width="1" opacity="0.7"/>
      <path d="${d}" fill="none" stroke="url(#${grad})" stroke-width="1.5" filter="url(#${filterId})" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" begin="${delay}s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1;2.5;1" dur="2.8s" begin="${delay}s" repeatCount="indefinite"/>
      </path>`;
  }

  function makeBeam(x1, y1, x2, y2, grad, delay) {
    return `
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2a2a2a" stroke-width="1" opacity="0.6"/>
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="url(#${grad})" stroke-width="2.5" filter="url(#glow)" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="2s" begin="${delay}s" repeatCount="indefinite"/>
      </line>`;
  }

  window.addEventListener('load', () => {
    setTimeout(drawConnectors, 100);
  });
  window.addEventListener('resize', drawConnectors);
</script>

</body>
</html>
